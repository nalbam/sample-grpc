name: build

# Verification only. Releases are published by release.yml from v* tags.
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nalbam/sample-grpc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup QEMU 📦
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx 📦
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for smoke test 🐳
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:smoke

      - name: Check installed packages 📋
        run: |
          docker run --rm "${IMAGE_NAME}:smoke" sh -c '
            python --version &&
            pip check &&
            pip list --format=freeze | grep -Ei "^(grpcio|protobuf)" &&
            grpc_health_probe -version'

      # Default PORT, then a custom PORT passed the same way as in a deployment.
      - name: Smoke test 🧪
        run: |
          trap 'docker rm -f smoke smoke-port >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke "${IMAGE_NAME}:smoke"
          docker run -d --name smoke-port -e PORT=50052 "${IMAGE_NAME}:smoke"
          for target in smoke:50051 smoke-port:50052; do
            name="${target%:*}" port="${target#*:}"
            if ! docker exec "$name" python smoke_test.py "localhost:${port}" \
              || ! docker exec "$name" grpc_health_probe -addr="localhost:${port}"; then
              docker logs "$name"
              exit 1
            fi
          done

      # Release publishes linux/amd64 and linux/arm64. Build arm64 here without pushing;
      # it is not started because the runner is amd64.
      # QEMU is set up before Buildx, so the builder can run the arm64 build steps.
      - name: Build linux/arm64 image 🐳
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:smoke-arm64
