name: build

# Verification only. Releases are published by release.yml from v* tags.
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nalbam/sample-grpc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx 📦
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for smoke test 🐳
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:smoke

      - name: Smoke test 🧪
        run: |
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 50051:50051 "${IMAGE_NAME}:smoke"
          if ! docker exec smoke python smoke_test.py localhost:50051 \
            || ! docker exec smoke grpc_health_probe -addr=localhost:50051; then
            docker logs smoke
            exit 1
          fi
