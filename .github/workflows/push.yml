name: build

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

env:
  AWS_ACCOUNT_ID: "968005369378"
  AWS_REGION: "ap-northeast-2"
  AWS_ROLE_NAME: "sample-grpc"

  IMAGE_NAME: nalbam/sample-grpc
  PLATFORM: linux/amd64,linux/arm64
  # Release and push steps run on pushes to main/master only.
  IS_RELEASE: ${{ github.event_name == 'push' }}

# Permission can be added at job level or workflow level
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: write   # This is required for actions/checkout

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup QEMU 📦
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx 📦
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test 🐳
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:smoke

      - name: Smoke test 🧪
        run: |
          docker run -d --name smoke -p 50051:50051 ${{ env.IMAGE_NAME }}:smoke
          docker exec smoke python smoke_test.py localhost:50051 || { docker logs smoke; exit 1; }
          docker exec smoke grpc_health_probe -addr=localhost:50051
          docker rm -f smoke

      - name: Bump Version 🏷️
        if: env.IS_RELEASE == 'true'
        id: bump
        uses: opspresso/action-builder@master
        with:
          args: --version

      - name: Release Version 🚀
        if: env.IS_RELEASE == 'true'
        uses: opspresso/action-builder@master
        with:
          args: --release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.version }}

      - name: Login to DockerHub 🔑
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Metadata 📦
        if: env.IS_RELEASE == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}},value=${{ steps.bump.outputs.version }}

      - name: Build and push 🐳
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger for GitOps 🚀
        if: env.IS_RELEASE == 'true'
        uses: opspresso/action-builder@master
        with:
          args: --dispatch
        env:
          GITHUB_TOKEN: ${{ secrets.GHP_TOKEN }}
          GITOPS_REPO: "opspresso/argocd-env-demo"
          PROJECT: ${{ github.event.repository.name }}
          VERSION: ${{ steps.bump.outputs.version }}

      # - name: Login to Github Container Registry 🔑
      #   uses: docker/login-action@v4
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.repository_owner }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

